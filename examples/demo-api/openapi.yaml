openapi: 3.0.3
info:
  title: PayMCP Demo API
  version: 0.1.0
  description: Tiny weather + echo API for paymcp demos (real x402 settlement on paid routes).
servers:
  - url: http://127.0.0.1:8787
paths:
  /health:
    get:
      operationId: health
      summary: Liveness probe
      x-paymcp:
        amount: "0"
        paid: false
      responses:
        "200":
          description: OK
  /echo:
    post:
      operationId: echoMessage
      summary: Echo a JSON message (paid)
      description: Returns the posted message after x402 settlement.
      x-paymcp:
        amount: "10000"
        description: Echo one JSON payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        "200":
          description: Echoed
  /weather:
    get:
      operationId: getWeather
      summary: Fake weather by city (paid)
      description: Returns a deterministic weather stub for the given city after payment.
      x-paymcp:
        amount: "25000"
        description: Weather lookup
      parameters:
        - name: city
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Weather
